<div class="lang-selector-wrapper" title="{{ t('Preferred Language') }}">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="2" y1="12" x2="22" y2="12"></line>
        <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
    </svg>
    <select onchange="window.location.href='/set-language/' + encodeURIComponent(this.value)" class="lang-select-input" aria-label="Select Language">
        {% for lang in supported_languages %}
        <option value="{{ lang.code }}" {% if current_lang == lang.code %}selected{% endif %}>
            {{ lang.native }}
        </option>
        {% endfor %}
    </select>
</div>
